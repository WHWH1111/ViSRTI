name: pytorch38-gpu
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.8.20
  - pip
  - numpy=1.24.4
  - scipy=1.10.1
  - pandas=2.0.3
  - scikit-learn=1.3.2
  - matplotlib=3.7.3
  - seaborn=0.13.2
  - tqdm=4.66.5
  - pytest=7.4.4
  - openpyxl=3.1.5
  - pillow=9.5.0
  - anyio=3.7.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu116
      - --find-links https://data.pyg.org/whl/torch-1.13.0+cu116.html
      - torch==1.13.1+cu116
      - torch-geometric==2.6.1
      - torch-scatter==2.1.0+pt113cu116
      - torch-sparse==0.6.15+pt113cu116
      - torch-cluster==1.6.0+pt113cu116
      - torch-spline-conv==1.2.1+pt113cu116
      - rdkit==2023.9.6
      - shap==0.43.0
      - python-docx==1.2.0
